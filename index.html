function ic2x(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>';}

/* Delegar */
function openDelegate(a){
  const opts=TEAM.filter(p=>!isResp(a,p.id));
  const body=`
    <div class="modal-hd"><div class="h"><h2>Delegar atividade</h2><div class="sub">De ${esc(respNames(a))} para outro colega — a responsabilidade passa a ser dele.</div></div><button class="x" id="mClose">${ic2x()}</button></div>
    <div class="modal-bd">
      <div class="fld"><label>Novo responsável</label>
        <div class="people-pick" id="delPick">
          ${opts.map(p=>`<button class="pp" data-id="${p.id}">${avatar(p.id,"sm")}<span class="nm">${esc(p.nome)}</span><span class="rl">${esc(p.papel)}</span></button>`).join("")}
        </div>
      </div>
      <div class="fld"><label>Recado <span class="opt">(opcional)</span></label><textarea class="ta" id="delMsg" placeholder="Ex.: Você tem mais experiência com esse tema…"></textarea></div>
    </div>
    <div class="modal-ft"><button class="btn btn-ghost" id="mCancel">Cancelar</button></div>`;
  openModal(body);
  $("#mClose").onclick=()=>renderDetail(a); $("#mCancel").onclick=()=>renderDetail(a);
  $$("#delPick .pp").forEach(b=>b.onclick=()=>{
    const msg=$("#delMsg").value.trim();
    delegateAct(a,b.dataset.id);
    if(msg){a.comments.push({autor:me,texto:msg,at:now()});persist();}
    render(); renderDetail(a); toast(`Delegada para ${byId(b.dataset.id).nome}`);
  });
}
/* Devolver */
function openReturn(a){
  const body=`
    <div class="modal-hd"><div class="h"><h2>Devolver para ajustes</h2><div class="sub">Volta para ${esc(respNames(a))} com o motivo registrado.</div></div><button class="x" id="mClose">${ic2x()}</button></div>
    <div class="modal-bd"><div class="fld"><label>Motivo da devolução</label><textarea class="ta" id="retMsg" placeholder="O que precisa ser ajustado?"></textarea></div></div>
    <div class="modal-ft"><button class="btn btn-ghost" id="mCancel">Cancelar</button><button class="btn btn-err" id="retDo">Devolver</button></div>`;
  openModal(body);
  $("#mClose").onclick=()=>renderDetail(a); $("#mCancel").onclick=()=>renderDetail(a);
  $("#retDo").onclick=()=>{
    const m=$("#retMsg").value.trim(); if(!m){toast("Descreva o motivo","warn");return;}
    returnAct(a,m); render(); renderDetail(a); toast("Atividade devolvida","warn");
  };
}
/* Encerrar (concluir direto ou cancelar/arquivar) */
function openClose(a){
  const body=`
    <div class="modal-hd"><div class="h"><h2>Encerrar atividade</h2><div class="sub">Finalize esta atividade agora — direto, sem passar pelo fluxo de aprovação.</div></div><button class="x" id="mClose">${ic2x()}</button></div>
    <div class="modal-bd">
      <div class="fld"><label>Observação <span class="opt">(opcional)</span></label><textarea class="ta" id="clNote" placeholder="Ex.: resolvido diretamente com a área · não é mais necessária…"></textarea></div>
      <div class="fld"><label>Como deseja encerrar?</label>
        <div style="display:flex;flex-direction:column;gap:9px">
          <button class="btn btn-ok" id="clDone" style="justify-content:flex-start">${ic("check")} Concluir — marcar como <b style="margin-left:4px">Concluída</b></button>
          <button class="btn btn-err" id="clCancel" style="justify-content:flex-start">${ic("inbox")} Encerrar / cancelar — <b style="margin-left:4px">Arquivar</b></button>
        </div>
      </div>
    </div>
    <div class="modal-ft"><button class="btn btn-ghost" id="mCancel">Voltar</button></div>`;
  openModal(body);
  $("#mClose").onclick=()=>renderDetail(a); $("#mCancel").onclick=()=>renderDetail(a);
  $("#clDone").onclick=()=>{ closeAct(a,"done",$("#clNote").value.trim()); render(); renderDetail(a); toast("Atividade concluída ✓"); };
  $("#clCancel").onclick=()=>{ closeAct(a,"arquivada",$("#clNote").value.trim()); render(); renderDetail(a); toast("Atividade encerrada e arquivada","warn"); };
}
function closeAct(a, mode, note){
  a.status=mode; a.updatedAt=now();
  a.flow.forEach(s=>s.status="done");
  const label = mode==="done" ? "concluiu (encerrou) a atividade" : "encerrou e arquivou a atividade";
  a.history.push({ator:me, acao: label + (note?`: "${note}"`:""), at:now()});
  if(note) a.comments.push({autor:me, texto:`Encerramento: ${note}`, at:now(), sys:true});
  persist(); notifyLast(a,false);
}

/* ══════════════════════ FORMULÁRIO (novo / editar) ══════════════════════ */
function openForm(edit){
  const a = edit || {titulo:"",desc:"",prioridade:"media",responsaveis:[me],responsavel:me,autorizador:"",prazo:""};
  const isEdit=!!edit;
  const body=`
    <div class="modal-hd"><div class="h"><h2>${isEdit?"Editar atividade":"Nova atividade"}</h2><div class="sub">${isEdit?"Ajuste os campos e salve.":"Descreva a tarefa, defina o responsável e, se precisar, quem autoriza."}</div></div><button class="x" id="mClose">${ic2x()}</button></div>
    <div class="modal-bd">
      <div class="fld"><label>Título</label><input class="inp" id="fTit" placeholder="Ex.: Análise de contrato de resseguro" value="${esc(a.titulo)}"></div>
      <div class="fld"><label>Descrição <span class="opt">(opcional)</span></label><textarea class="ta" id="fDesc" placeholder="Contexto, entregável esperado, prazos internos…">${esc(a.desc)}</textarea></div>
      <div class="fld"><label>Prioridade</label>
        <div class="seg" id="fPri">${PRI.map(p=>`<button class="seg-o ${a.prioridade===p.id?'on':''}" data-id="${p.id}" style="${a.prioridade===p.id?`background:${p.cor};box-shadow:0 2px 10px ${p.cor}55`:''}">${p.nome}</button>`).join("")}</div>
      </div>
      <div class="fld"><label>Responsáveis <span class="opt">(pode marcar mais de um)</span></label>
        <div class="people-pick" id="fResp">${TEAM.map(p=>`<button class="pp ${respArr(a).includes(p.id)?'on':''}" data-id="${p.id}">${avatar(p.id,"sm")}<span class="nm">${esc(p.nome)}</span><span class="rl">${esc(p.papel)}</span></button>`).join("")}</div>
      </div>
      <div class="grid2">
        <div class="fld"><label>Autorização <span class="opt">(opcional)</span></label>
          <select class="sel" id="fAuth"><option value="">Não exige aprovação</option>${TEAM.map(p=>`<option value="${p.id}" ${a.autorizador===p.id?"selected":""}>${p.nome} · ${p.papel}</option>`).join("")}</select>
        </div>
        <div class="fld"><label>Prazo <span class="opt">(opcional)</span></label><input class="inp" type="date" id="fPrazo" value="${esc(a.prazo||"")}"></div>
      </div>
    </div>
    <div class="modal-ft"><button class="btn btn-ghost" id="mCancel">Cancelar</button><button class="btn btn-primary" id="fSave">${isEdit?"Salvar alterações":"Criar atividade"}</button></div>`;
  openModal(body);
  let sel={pri:a.prioridade}; const selResps=new Set(respArr(a));
  $("#mClose").onclick=()=> isEdit?renderDetail(edit):closeModal();
  $("#mCancel").onclick=()=> isEdit?renderDetail(edit):closeModal();
  $$("#fPri .seg-o").forEach(b=>b.onclick=()=>{
    sel.pri=b.dataset.id;
    $$("#fPri .seg-o").forEach(x=>{x.classList.remove("on");x.style.cssText="";});
    const c=(PRI.find(p=>p.id===sel.pri)||{}).cor; b.classList.add("on"); b.style.cssText=`background:${c};box-shadow:0 2px 10px ${c}55;color:#fff;border-color:transparent`;
  });
  $$("#fResp .pp").forEach(b=>b.onclick=()=>{
    const id=b.dataset.id;
    if(selResps.has(id)) selResps.delete(id); else selResps.add(id);
    b.classList.toggle("on", selResps.has(id));
  });
  $("#fSave").onclick=()=>{
    const tit=$("#fTit").value.trim(); if(!tit){toast("Dê um título à atividade","warn");return;}
    const auth=$("#fAuth").value, prazo=$("#fPrazo").value, desc=$("#fDesc").value.trim();
    const resps=[...selResps]; if(!resps.length){toast("Escolha ao menos um responsável","warn");return;}
    if(isEdit){
      // detecta o que mudou (para o e-mail e o histórico)
      const changes=[];
      const oldPrazo=edit.prazo||"", oldPri=edit.prioridade, oldTit=edit.titulo, oldDesc=edit.desc||"";
      const prevKey=respArr(edit).slice().sort().join(","), newKey=resps.slice().sort().join(",");
      if(oldTit!==tit) changes.push(`título alterado para "${tit}"`);
      if(oldPrazo!==prazo) changes.push(`prazo alterado de ${fmtBR(oldPrazo)||"—"} para ${fmtBR(prazo)||"—"}`);
      if(oldPri!==sel.pri) changes.push(`prioridade alterada para ${(PRI.find(p=>p.id===sel.pri)||{}).nome}`);
      if((edit.autorizador||"")!==auth) changes.push(`autorização alterada para ${auth?byId(auth).nome:"não exige"}`);
      if(prevKey!==newKey) changes.push(`responsáveis alterados para ${resps.map(id=>byId(id).nome).join(", ")}`);
      if(oldDesc!==desc) changes.push(`descrição atualizada`);

      edit.titulo=tit; edit.desc=desc; edit.prioridade=sel.pri; edit.prazo=prazo; edit.updatedAt=now();
      if((edit.autorizador||"")!==auth){edit.autorizador=auth; syncFlowToStatus(edit);}
      if(prevKey!==newKey){
        edit.responsaveis=resps; edit.responsavel=resps[0];
        const ri=currentRespIndex(edit); if(ri>=0){ edit.flow[ri].pessoas=resps.slice(); delete edit.flow[ri].pessoa; }
      }
      const resumo = changes.length? changes.join("; ") : "sem alterações de campo";
      edit.history.push({ator:me,acao:`editou a atividade — ${resumo}`,at:now()});
      persist(); render(); renderDetail(edit); toast("Alterações salvas");
      if(changes.length) notifyLast(edit,false);
    }else{
      const soloMe = resps.length===1 && resps[0]===me;
      const flow=[];
      if(soloMe){ flow.push({pessoas:[me],papel:"Responsável",status:"current"}); }
      else{ flow.push({pessoa:me,papel:"Designou",status:"done"}); flow.push({pessoas:resps.slice(),papel:"Responsável",status:"current"}); }
      if(auth) flow.push({pessoa:auth,papel:"Autoriza",status:"pending"});
      const na={
        id:uid(), titulo:tit, desc, prioridade:sel.pri, status:"todo",
        criadoPor:me, responsaveis:resps, responsavel:resps[0], autorizador:auth, prazo,
        createdAt:now(), updatedAt:now(), flow,
        comments:[], history:[{ator:me,acao:`criou a atividade${!soloMe?` e designou para ${resps.map(id=>byId(id).nome).join(", ")}`:""}`,at:now()}],
      };
      store.activities.unshift(na); persist(); render(); closeModal();
      toast("Atividade criada ✓"); notify(na,"Nova tarefa atribuída a você.",true); setTimeout(()=>openDetail(na.id),120);
    }
  };
  setTimeout(()=>$("#fTit").focus(),60);
}

/* ══════════════════════ SINCRONIZAÇÃO (export / import) ══════════════════════ */
function openSync(){
  const json=JSON.stringify(store,null,2);
  const body=`
    <div class="modal-hd"><div class="h"><h2>Backup & restauração</h2><div class="sub">${API!==null?"Você está <b>ao vivo</b> com a equipe — a sincronização é automática. Use isto só para guardar uma cópia de segurança ou restaurar.":"Aberto como arquivo: os dados ficam neste navegador. Exporte e envie para um colega — quem receber usa \"Importar\"."}</div></div><button class="x" id="mClose">${ic2x()}</button></div>
    <div class="modal-bd">
      <div class="fld"><label>1 · Exportar quadro</label>
        <div style="display:flex;gap:9px;flex-wrap:wrap">
          <button class="btn btn-primary" id="sxDownload">${ic("share")} Baixar arquivo (.json)</button>
          <button class="btn" id="sxCopy">Copiar para a área de transferência</button>
        </div>
        <div class="note" style="color:var(--tx3);font-size:11px">${store.activities.length} atividade(s) · gerado por ${esc(byId(me).nome)}</div>
      </div>
      <div class="fld d-sec" style="padding-top:16px"><label>2 · Importar quadro recebido</label>
        <textarea class="ta" id="sxIn" placeholder="Cole aqui o conteúdo .json recebido de um colega…" style="min-height:100px;font-family:var(--fn-mono);font-size:11px"></textarea>
        <div style="display:flex;gap:9px;align-items:center;flex-wrap:wrap">
          <input type="file" id="sxFile" accept=".json,application/json" style="display:none">
          <button class="btn btn-sm" id="sxPick">Escolher arquivo…</button>
          <button class="btn btn-ok btn-sm" id="sxMerge">Mesclar (recomendado)</button>
          <button class="btn btn-err btn-sm" id="sxReplace">Substituir tudo</button>
        </div>
        <div class="note" style="color:var(--tx3);font-size:11px">Mesclar mantém as duas versões, escolhendo sempre a atualização mais recente de cada atividade.</div>
      </div>
      ${CLOUD?`<div class="fld d-sec" style="padding-top:16px"><label>Sessão</label><div><button class="btn btn-err btn-sm" id="sxLogout">Sair (encerrar acesso neste dispositivo)</button></div></div>`:""}
    </div>`;
  openModal(body,"wide");
  $("#mClose").onclick=closeModal;
  $("#sxLogout")&&($("#sxLogout").onclick=cloudLogout);
  $("#sxDownload").onclick=async()=>{
    const data=JSON.stringify(store,null,2);
    if(window.claude&&window.claude.downloads){
      try{ await window.claude.downloads.save({filename:"fluxo-juridico-hero.json",data}); toast("Arquivo salvo"); return; }
      catch(err){ if(err&&err.code==="declined"){toast("Download cancelado","warn");return;} }
    }
    // fallback navegador comum
    try{
      const blob=new Blob([data],{type:"application/json"});
      const url=URL.createObjectURL(blob); const link=document.createElement("a");
      link.href=url; link.download="fluxo-juridico-hero.json"; link.click();
      setTimeout(()=>URL.revokeObjectURL(url),1000); toast("Download iniciado");
    }catch(e){ navigator.clipboard.writeText(data); toast("Copiado (download indisponível)","info"); }
  };
  $("#sxCopy").onclick=()=>{navigator.clipboard.writeText(JSON.stringify(store,null,2));toast("Copiado ✓");};
  $("#sxPick").onclick=()=>$("#sxFile").click();
  $("#sxFile").onchange=e=>{
    const f=e.target.files[0]; if(!f)return;
    const r=new FileReader(); r.onload=()=>{$("#sxIn").value=r.result;toast("Arquivo carregado — escolha Mesclar ou Substituir","info");}; r.readAsText(f);
  };
  $("#sxMerge").onclick=()=>doImport($("#sxIn").value,false);
  $("#sxReplace").onclick=()=>doImport($("#sxIn").value,true);
}
function doImport(raw, replace){
  let inc; try{ inc=JSON.parse(raw); }catch(e){ toast("JSON inválido","err"); return; }
  const arr = Array.isArray(inc)? inc : (inc&&inc.activities);
  if(!Array.isArray(arr)){ toast("Formato não reconhecido","err"); return; }
  if(replace){
    store.activities = arr; persist(); closeModal(); render();
    toast(`Quadro substituído · ${arr.length} atividade(s)`); return;
  }
  const map=new Map(store.activities.map(a=>[a.id,a]));
  let add=0,upd=0;
  arr.forEach(a=>{
    const ex=map.get(a.id);
    if(!ex){ map.set(a.id,a); add++; }
    else if(new Date(a.updatedAt||0) > new Date(ex.updatedAt||0)){ map.set(a.id,a); upd++; }
  });
  store.activities=[...map.values()].sort((x,y)=>new Date(y.updatedAt||0)-new Date(x.updatedAt||0));
  persist(); closeModal(); render();
  toast(`Mesclado · ${add} nova(s), ${upd} atualizada(s)`);
}

/* ══════════════════════ MODAL BASE ══════════════════════ */
let ov=null;
function openModal(inner, extraCls=""){
  closeModal();
  const el=document.createElement("div"); el.className="ov";
  el.innerHTML=`<div class="modal ${extraCls}">${inner}</div>`;
  document.body.appendChild(el);
  ov=el;
  requestAnimationFrame(()=>el.classList.add("on"));
  el.addEventListener("mousedown",e=>{if(e.target===el)closeModal();});
}
function closeModal(){ if(ov){const o=ov;ov=null;o.classList.remove("on");setTimeout(()=>o.remove(),200);} detailId=null; }
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

/* ══════════════════════ HEADER BTNS ══════════════════════ */
$("#btnNew").onclick=()=>openForm(null);
$("#btnSync").onclick=openSync;

/* ══════════════════════ GATE DE SENHA (nuvem) ══════════════════════ */
function hideBoot(){ const b=document.getElementById("boot"); if(b){ b.style.transition="opacity .35s"; b.style.opacity="0"; setTimeout(()=>b.remove(),360); } }
function showAuthGate(msg){
  document.getElementById("gate").classList.add("hidden");
  hideBoot();
  let g=document.getElementById("authgate");
  if(!g){
    g=document.createElement("div"); g.className="gate"; g.id="authgate";
    g.innerHTML=`<div class="gate-card">
      <div class="gate-mark">HG</div>
      <h1>Fluxo Jurídico</h1>
      <p>Acesso restrito à equipe jurídica · HERO Seguros</p>
      <div class="fld" style="text-align:left;gap:10px">
        <input class="inp" id="agPass" type="password" placeholder="Senha da equipe" autocomplete="current-password">
        <button class="btn btn-primary" id="agGo" style="justify-content:center;padding:11px">Entrar</button>
        <div id="agErr" style="color:#fca5a5;font-size:12px;min-height:15px"></div>
      </div>
    </div>`;
    document.body.appendChild(g);
    const go=async()=>{
      const err=g.querySelector("#agErr"), btn=g.querySelector("#agGo");
      err.textContent=""; btn.disabled=true; btn.textContent="Entrando…";
      const pass=g.querySelector("#agPass").value;
      const {error}=await sb.auth.signInWithPassword({email:CFG.LOGIN_EMAIL, password:pass});
      if(error){ err.textContent="Senha incorreta ou acesso indisponível."; btn.disabled=false; btn.textContent="Entrar"; return; }
      g.remove(); afterAuth();
    };
    g.querySelector("#agGo").onclick=go;
    g.querySelector("#agPass").addEventListener("keydown",e=>{if(e.key==="Enter")go();});
  }
  if(msg) g.querySelector("#agErr").textContent=msg;
  setTimeout(()=>g.querySelector("#agPass").focus(),60);
}
async function afterAuth(){
  document.getElementById("gate").classList.remove("hidden");
  renderGate();
  if(me && TEAM.some(p=>p.id===me)) setUser(me);
  await cloudLoad();
  await cloudPush();               // sobe atividades que só existiam localmente (ex.: exemplo inicial)
  await mapsLoad();                // carrega os mapas mentais da equipe
  if(me && TEAM.some(p=>p.id===me)) render();
  cloudSubscribe();
  mapsSubscribe();
  setConn(connState);
  hideBoot();
}

/* ══════════════════════ BOOT ══════════════════════ */
async function boot(){
  if(CLOUD){
    try{
      const {data}=await sb.auth.getSession();
      if(data && data.session){ afterAuth(); }
      else{ showAuthGate(); }
    }catch(e){ showAuthGate("Não consegui conectar ao Supabase. Confira a conexão."); }
    return;
  }
  // modo servidor-na-rede (http) ou local (arquivo)
  renderGate();
  if(me && TEAM.some(p=>p.id===me)){ setUser(me); }
  if(API!==null){
    apiGet().then(changed=>{ if(me && TEAM.some(p=>p.id===me) && changed) render(); });
    startPolling();
  }
  setConn(connState);
  hideBoot();
}
boot();
</script>
